# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade:
#
#   npm install --save-dev @n8n/node-cli@latest
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# STEP 1 — npm Granular Access Token (required until the package exists):
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token.
#      Packages and scopes: "Read and write", applied to ALL PACKAGES. Scoping it
#      to this package is impossible before the first publish — the package is not
#      in the list yet, and npm answers an unauthorised publish with a 404.
#      Tick "Bypass two-factor authentication": CI cannot answer a 2FA prompt.
#      Leave "Allowed IP ranges" empty; GitHub runners have changing addresses.
#   2. In GitHub: Settings → Secrets and variables → Actions → New repository
#      secret, named exactly NPM_TOKEN.
#
# STEP 2 — switch to OIDC Trusted Publishing once the package exists:
#   1. On npmjs.com open the package settings → "Publish access" →
#      "Trusted Publishers" → Add a publisher → GitHub Actions:
#        Repository owner: MailGraf
#        Repository name:  n8n-mailgraf
#        Workflow name:    publish.yml
#        Environment:      (leave blank)
#   2. Delete the NPM_TOKEN secret here, revoke the token on npm, and drop the
#      "Check npm authentication" step below plus the npm config line.
#   After this there is no secret to leak and no expiry date to chase.
#
# Provenance is signed by GitHub's OIDC infrastructure either way.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Run the following command locally to start an interactive release:
#
#   npm run release
#
# This will lint, build, prompt for a version bump, update the changelog,
# commit, tag, and push — which triggers this workflow to publish to npm.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check npm authentication
        # Field lesson (21 Sep 2026): the first release failed here with a bare npm
        # auth error, and the npm token page showed "Last used: never". The secret
        # simply was not set, but nothing in the log said so. Fail loudly instead.
        #
        # Trusted Publishing (OIDC) is the intended end state — no secret at all.
        # Until this package is configured for it on npmjs.com, a token is required.
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set on this repository."
            echo ""
            echo "Publishing needs one of these:"
            echo "  1. Add the secret: repo Settings -> Secrets and variables ->"
            echo "     Actions -> New repository secret, named exactly NPM_TOKEN."
            echo "     The npm token needs write access to ALL packages while this"
            echo "     package does not exist yet."
            echo "  2. Or configure Trusted Publishing for this package on npmjs.com"
            echo "     and remove this check."
            echo ""
            echo "Nothing was published. The tag stays; re-run this job once fixed."
            exit 1
          fi
          echo "NPM_TOKEN is present."
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # Lint and build run automatically as part of the release process.
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
